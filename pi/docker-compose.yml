services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    env_file:
      - .env
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=home
      - DOCKER_INFLUXDB_INIT_BUCKET=span
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN}

  grafana:
    # Pinned 2026-08-22 (#16) to the version running on the Pi at pin time
    # (`docker exec grafana grafana-server -v` -> 12.3.1), so upstream
    # :latest churn can't surprise-upgrade it. Bump deliberately.
    image: grafana/grafana:12.3.1
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    env_file:
      - .env
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SERVER_ROOT_URL=https://grafana.pianohouseproject.org
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.resend.com:465
      - GF_SMTP_USER=resend
      - GF_SMTP_PASSWORD=${RESEND_API_KEY}
      - GF_SMTP_FROM_ADDRESS=grafana@pianohouseproject.org
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
    depends_on:
      - influxdb

  collector:
    build: .
    container_name: span-collector
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=home
      - INFLUXDB_BUCKET=span
      - SPAN_PANEL_IP=192.168.4.72
      - POLL_INTERVAL=30
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - influxdb

  bath-detector:
    build: .
    container_name: bath-detector
    restart: unless-stopped
    command: ["python", "-u", "bath_detector.py", "--loop"]
    env_file:
      - .env
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=home
      - INFLUXDB_BUCKET=span
    depends_on:
      - influxdb

  charge-detector:
    build: .
    container_name: charge-detector
    restart: unless-stopped
    command: ["python", "-u", "charge_detector.py", "--loop"]
    env_file:
      - .env
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=home
      - INFLUXDB_BUCKET=span
    depends_on:
      - influxdb

  weather:
    build: .
    container_name: weather
    restart: unless-stopped
    command: ["python", "-u", "weather_poller.py", "--loop"]
    env_file:
      - .env
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=home
      - INFLUXDB_BUCKET=span
    depends_on:
      - influxdb

  hvac-classifier:
    build: .
    container_name: hvac-classifier
    restart: unless-stopped
    command: ["python", "-u", "hvac_classifier.py", "--loop"]
    env_file:
      - .env
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=home
      - INFLUXDB_BUCKET=span
      # Drives the nightly self-heal sweep's day boundary (02:00 local) --
      # see hvac_classifier.py's SWEEP_HOUR comment. Same mechanism
      # daily-report already relies on below.
      - TZ=America/Los_Angeles
    depends_on:
      - influxdb

  daily-report:
    build: .
    container_name: daily-report
    restart: unless-stopped
    command: ["python", "-u", "daily_report.py", "--loop"]
    env_file:
      - .env
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=home
      - INFLUXDB_BUCKET=span
      - RESEND_API_KEY=${RESEND_API_KEY}
      - REPORT_EMAIL=${REPORT_EMAIL}
      - TZ=America/Los_Angeles
      - GAP_COVERAGE_MIN=0.95
    volumes:
      - report-state:/app/state
    depends_on:
      - influxdb

  cloudflared:
    # Pinned 2026-08-22 (#16) to the version running on the Pi at pin time
    # (`docker exec cloudflared cloudflared --version` -> 2026.3.0), so
    # upstream :latest churn can't surprise-upgrade it. Bump deliberately.
    image: cloudflare/cloudflared:2026.3.0
    container_name: cloudflared
    restart: unless-stopped
    # Token goes in as a file (built from CLOUDFLARE_TUNNEL_TOKEN in .env, see
    # `secrets:` below), not argv/env: `--token ${...}` put it in plaintext in
    # `ps` and `docker inspect`, and `env_file: .env` gave this internet-facing
    # container every secret in the file (prompt-lab #55). Never re-add
    # `--token`; it overrides `--token-file`.
    command: tunnel --no-autoupdate run --token-file /run/secrets/tunnel_token
    secrets:
      - tunnel_token
    depends_on:
      - grafana

  telegraf:
    image: telegraf:1.31
    container_name: telegraf
    restart: unless-stopped
    # gid 984: `getent group docker | cut -d: -f3` on the Pi, 2026-08-22.
    # Needed so the non-root telegraf user in the image can read the
    # docker.sock bind mount.
    user: "telegraf:984"
    environment:
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - HOST_PROC=/hostfs/proc
      - HOST_SYS=/hostfs/sys
      - HOST_MOUNT_PREFIX=/hostfs
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/hostfs:ro
    depends_on:
      - influxdb

volumes:
  influxdb-data:
  influxdb-config:
  grafana-data:
  report-state:

secrets:
  tunnel_token:
    environment: CLOUDFLARE_TUNNEL_TOKEN
